route:
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  receiver: incident-responder

inhibit_rules:
  - source_match:
      alertname: OrderTrackerDown
      severity: critical
    target_match_re:
      alertname: OrderTracker(HighErrorRate|SlowResponses)
    equal: ["job", "environment"]

receivers:
  - name: incident-responder
    webhook_configs:
      - url: http://responder:8001/alerts
        send_resolved: true
