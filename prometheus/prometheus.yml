global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: order-tracker
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          environment: local
    honor_labels: true
