apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: order-tracker-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s

  - name: Loki
    type: loki
    uid: order-tracker-loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000

  - name: Tempo
    type: tempo
    uid: order-tracker-tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: order-tracker-loki
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        filterByTraceID: true
      tracesToMetrics:
        datasourceUid: order-tracker-prometheus
      serviceMap:
        datasourceUid: order-tracker-prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false