[project]
name = "incident-response"
version = "0.1.0"
description = "Receives Grafana alerts, captures logs and traces, and launches a coding assistant headlessly"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "structlog>=24,<27",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
